steps:
  # 1. Build Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/sdlc-test-project-jianxiwang/chefs-companion-repo/app:$COMMIT_SHA', '.']
    id: 'build_step'

  # 2. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'chefs-companion-svc'  # Single service name
      - '--image'
      - 'us-central1-docker.pkg.dev/sdlc-test-project-jianxiwang/chefs-companion-repo/app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
    id: 'deploy_svc'
    waitFor: ['build_step']

# This section tells Cloud Build to push the image and generate provenance
images:
  - 'us-central1-docker.pkg.dev/sdlc-test-project-jianxiwang/chefs-companion-repo/app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED # This ensures provenance generation
